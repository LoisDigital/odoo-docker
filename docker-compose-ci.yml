version: '3.1'
services:
  web:
    user: root
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=myodoo
    volumes:
      - "../custom_addons/:/opt/odoo/custom_addons/loistalagrand"
      - "./odoo.conf:/etc/odoo/odoo.conf"
    command: >
      /opt/odoo/odoo/odoo-bin 
      --config=/etc/odoo/odoo.conf
      --stop-after-init
      --database testing_db 
      --db_user=odoo
      --db_host=db
      --db_password=myodoo
      --init customize
      --test-tags /panda_lingua 
    tty: true # add color to logs
  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=myodoo
      - POSTGRES_USER=odoo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5